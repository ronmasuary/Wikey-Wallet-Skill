name: CI
on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --prefix wikey-wallet-skill
      - name: Build
        run: npm run build --prefix wikey-wallet-skill
      - name: Test
        run: npm test --prefix wikey-wallet-skill
