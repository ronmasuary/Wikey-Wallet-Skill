name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build .skill
        run: zip -r wikey-wallet-skill.skill wikey-wallet-skill/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wikey-wallet-skill.skill
          generate_release_notes: true
